services:
  music:
    image: ghcr.io/paulbayfield/music.bayfield.dev:latest
    build: .
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://music:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@music-db:5432/music
      DATABASE_POOL_MAX: "10"
    ports:
      - "8791:8791"
    depends_on:
      music-db:
        condition: service_healthy
    restart: unless-stopped

  music-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: music
      POSTGRES_USER: music
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - music-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  music-db:
